<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Study</title>
    <style>
        body { margin: 0; padding: 0; background: #fafafa; font-family: -apple-system, sans-serif; color: #222; }
        .top { padding: 14px 20px; border-bottom: 1px solid #eee; background: #fff; display: flex; justify-content: space-between; align-items: center; }
        .top a { color: #3498db; text-decoration: none; font-size: 0.9em; }
        .stats { color: #666; font-size: 0.9em; }
        .stage { max-width: 540px; margin: 80px auto; padding: 0 24px; text-align: center; }
        .card { background: #fff; border: 1px solid #e6e6e6; border-radius: 12px; padding: 50px 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); min-height: 220px; display: flex; flex-direction: column; justify-content: center; }
        .fr { font-size: 2em; font-family: Georgia, serif; color: #222; margin-bottom: 12px; }
        .context { color: #999; font-style: italic; font-size: 0.9em; line-height: 1.5; margin-top: 10px; }
        .en { font-size: 1.4em; color: #1a73e8; margin-top: 18px; }
        .note { color: #666; font-size: 0.9em; margin-top: 8px; }
        .flip-btn { margin-top: 30px; background: #212529; color: #fff; border: none; padding: 12px 28px; border-radius: 8px; cursor: pointer; font-size: 1em; }
        .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 24px; }
        .grade { padding: 12px 6px; border: none; border-radius: 8px; cursor: pointer; color: #fff; font-weight: 600; font-size: 0.9em; }
        .grade.again { background: #e53935; }
        .grade.hard  { background: #fb8c00; }
        .grade.good  { background: #43a047; }
        .grade.easy  { background: #1e88e5; }
        .empty { color: #888; padding: 60px 20px; font-size: 1.1em; }
        .empty a { color: #1a73e8; }
    </style>
</head>
<body>
    <div class="top">
        <a href="/">← Back to Library</a>
        <span class="stats" id="stats">…</span>
    </div>
    <div class="stage" id="stage">
        <div class="empty">Loading…</div>
    </div>

    <script>
        let queue = [];
        let current = null;
        let revealed = false;

        async function fetchDue() {
            const r = await fetch('/api/vocab/due');
            const d = await r.json();
            queue = d.cards || [];
            document.getElementById('stats').textContent =
                `${d.stats.due} due · ${d.stats.total} total`;
            next();
        }

        function next() {
            revealed = false;
            current = queue.shift() || null;
            render();
        }

        function render() {
            const stage = document.getElementById('stage');
            if (!current) {
                stage.innerHTML = `
                  <div class="empty">
                    🎉 Nothing due. <br><br>
                    <a href="/">Back to library</a>
                  </div>`;
                fetchStats();
                return;
            }
            stage.innerHTML = `
              <div class="card">
                <div class="fr">${escapeHtml(current.fr)}</div>
                ${current.context_sentence ? `<div class="context">${escapeHtml(current.context_sentence)}</div>` : ''}
                ${revealed ? `<div class="en">${escapeHtml(current.en)}</div>` : ''}
              </div>
              ${revealed ? `
                <div class="grades">
                  <button class="grade again" onclick="grade(0)">Again</button>
                  <button class="grade hard"  onclick="grade(1)">Hard</button>
                  <button class="grade good"  onclick="grade(2)">Good</button>
                  <button class="grade easy"  onclick="grade(3)">Easy</button>
                </div>
              ` : `
                <button class="flip-btn" onclick="reveal()">Show answer</button>
              `}
            `;
        }

        function reveal() { revealed = true; render(); }

        async function grade(g) {
            if (!current) return;
            const id = current.id;
            await fetch(`/api/vocab/${id}/review`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ grade: g }),
            });
            next();
            fetchStats();
        }

        async function fetchStats() {
            const r = await fetch('/api/vocab/due');
            const d = await r.json();
            document.getElementById('stats').textContent =
                `${d.stats.due} due · ${d.stats.total} total`;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        document.addEventListener('keydown', (e) => {
            if (!current) return;
            if (!revealed) {
                if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); reveal(); }
            } else {
                if (e.key === '1') grade(0);
                else if (e.key === '2') grade(1);
                else if (e.key === '3') grade(2);
                else if (e.key === '4') grade(3);
            }
        });

        fetchDue();
    </script>
</body>
</html>
